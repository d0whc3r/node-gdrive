name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build:base
      - run: pnpm test:coverage
        env:
          CI: true
      - name: Integration tests (master push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: pnpm test:integration
        env:
          CI: true
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          DELETE_ALL_FILES: ${{ secrets.DELETE_ALL_FILES }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}

  build-sea:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: node-gdrive-linux-x64
            binary: node-gdrive
          - os: macos-latest
            artifact: node-gdrive-macos-arm64
            binary: node-gdrive
          - os: windows-latest
            artifact: node-gdrive-win-x64.exe
            binary: node-gdrive.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ matrix.binary }}" "release-assets/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}

  release:
    needs: [verify, build-sea]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:base
      - name: Download SEA binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Semantic Release
        run: pnpm semantic-release
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
